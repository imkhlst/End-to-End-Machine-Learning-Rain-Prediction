grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 3
    verbose: 2
    n_jobs: 1

model_selection:
  module_0:
    class: KNeighborsClassifier
    module: sklearn.neighbors
    params:
      algorithm: kd_tree
      weights: uniform
      n_neighbors: 3
      leaf_size: 10
      p: 1
    search_param_grid:
      algorithm:
      - auto
      - ball_tree
      - kd_tree
      - brute
      weights:
      - uniform
      - distance
      n_neighbors:
      - 3
      - 4
      - 5
      - 6
      - 7
      leaf_size:
      - 10
      - 20
      - 30
      - 40
      - 50
      p:
      - 1
      - 2
      - 3
  
  module_1:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      n_estimators: 100
      criterion: gini
      max_depth: None
      min_samples_split: 2
      min_samples_leaf: 1
    search_param_grid:
      n_estimators:
        - 100
        - 200
        - 300
        - 400
        - 500
      criterion:
        - gini
        - entropy
        - log_loss
      max_depth:
        - None
        - 10
        - 20
        - 30
        - 40
        - 50
      min_samples_split:
        - 2
        - 5
        - 10
      min_samples_leaf:
        - 1
        - 2
        - 4